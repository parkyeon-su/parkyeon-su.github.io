<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 홈페이지</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
      text-align: center;
    }

    main {
      max-width: 700px;
      margin: 100px auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 42px;
      color: #2563eb;
    }

    p {
      font-size: 19px;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      color: white;
      background: #2563eb;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <main>
    <h1>안녕하세요!</h1>
    <p>제가 처음 만든 GitHub 홈페이지입니다.</p>
    <a href="mailto:example@email.com">이메일 보내기</a>
  </main>
</body>
</html>
